services:
  audiobookshelf:
    image: advplyr/audiobookshelf:2.36.0
    ports:
      - "13378:80"
    volumes:
      - abs-config:/config
      - abs-metadata:/metadata
    # ABS can kill itself during `backup apply`: BackupManager.requestApplyBackup
    # disconnects the database, then spends seconds extracting the sqlite file and
    # the metadata-items/ + metadata-authors/ folders before reconnecting. Writing
    # into /metadata wakes ABS's own folder watcher, whose handler queries the DB
    # (library.findByPk) while it is disconnected — "ConnectionManager.getConnection
    # was called after the connection manager was closed" — and the unhandled
    # rejection exits the process. Without a restart policy that one upstream race
    # takes the whole smoke suite down with it. Full write-up, and what an upstream
    # report should say, in docs/abs-upstream-bugs.md.
    restart: unless-stopped
    environment:
      - PORT=80
      # The smoke test authenticates via `abs-cli login` at every section
      # (no curl token plumbing), which exceeds ABS's default auth rate
      # limit (40 logins / 10 min). Disable it on this disposable test stack.
      - RATE_LIMIT_AUTH_MAX=0

volumes:
  abs-config:
  abs-metadata:

# This directory is named "docker", so Compose derives the project name "docker"
# — as does any sibling repo with a docker/ dir, which lands their containers in
# our docker_default network as orphans. An explicit network name keeps the two
# apart, so `down -v` here can't tear the network out from under a sibling stack.
networks:
  default:
    name: abs-cli-dev
